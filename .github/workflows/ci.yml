name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api:
    name: API — Lint, Type-check, Test
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install dependencies
        working-directory: apps/api
        run: npm ci

      - name: Type check
        working-directory: apps/api
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: apps/api
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/career-compass-test
          JWT_ACCESS_SECRET: ci-test-access-secret-min-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-min-32-chars-long
