version: '3.8'

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/career-compass-dev
      JWT_ACCESS_SECRET: dev-access-secret-key-change-in-production-min-32-chars
      JWT_REFRESH_SECRET: dev-refresh-secret-key-change-in-production-min-32-chars
      AI_SERVICE_URL: http://ai-service:8000
      AI_SERVICE_INTERNAL_TOKEN: dev-shared-secret-change-in-production
      CORS_ORIGIN: http://localhost:3001
      STUDENT_REPORTS_STORAGE_DIR: /app/storage/reports
    volumes:
      - reports_data:/app/storage/reports
      - ../files:/app/files
    depends_on:
      - mongodb
      - redis
      - ai-service
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3000/api/v1
    depends_on:
      - api
    restart: unless-stopped

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/career_compass_rag
      AI_SERVICE_INTERNAL_TOKEN: dev-shared-secret-change-in-production
      # Set OPENAI_API_KEY (and optionally OPENAI_MODEL) to activate real
      # LLM generation + embeddings; the service otherwise runs against the
      # dependency-free local fallback provider (see rag/llm/fallback_provider.py).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      - postgres
    restart: unless-stopped

  # Dedicated vector store for the AI Counsellor's knowledge base — separate
  # from the app's MongoDB, since pgvector needs Postgres. Only ai-service
  # talks to this database; Nest never does (see apps/ai-service/db/postgres.py).
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: career_compass_rag

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: career-compass-dev

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
  postgres_data:
  reports_data:
